name: install-ping

# The anonymous counts the plugin sends. One release, install-ping, holds one-byte assets:
#  - installed.txt, downloaded once per machine: its download count is the install count;
#  - active-<ISO week>.txt (e.g. active-2026-W43.txt), downloaded once per machine per week: weekly actives.
# Every Monday this makes sure the assets of this week and the next four exist. It never replaces an asset:
# that would reset its download count.
on:
  workflow_dispatch:
  schedule:
    - cron: '7 0 * * 1'

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release and the missing assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # GitHub refuses an empty asset: one byte.
          echo 1 > installed.txt
          if ! gh release view install-ping --repo "$REPO" >/dev/null 2>&1; then
            gh release create install-ping installed.txt --repo "$REPO" --target "$GITHUB_SHA" --latest=false \
              --title "Install count (not a version)" \
              --notes "The plugin downloads installed.txt once per machine (the install count) and active-<week>.txt once per machine per ISO week (weekly actives). Nothing else is sent. See Privacy in the README."
          fi
          have=$(gh release view install-ping --repo "$REPO" --json assets -q '.assets[].name')
          echo "$have" | grep -qx installed.txt || gh release upload install-ping installed.txt --repo "$REPO"
          for n in 0 1 2 3 4; do
            f="active-$(date -u -d "+$n week" +%G-W%V).txt"
            if echo "$have" | grep -qx "$f"; then echo "$f already there"; continue; fi
            echo 1 > "$f" && gh release upload install-ping "$f" --repo "$REPO" && echo "$f created"
          done
