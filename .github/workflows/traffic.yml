name: Traffic snapshot

# GitHub keeps clones and views for 14 days only. This job reads them every day and merges them
# into docs/traffic.json, so the history survives. It needs a token with push access on this
# repository (the default GITHUB_TOKEN cannot read traffic): a fine-grained personal access token
# scoped to this repository with "Administration: read-only", stored as the secret TRAFFIC_TOKEN.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch clones and views and merge them into docs/traffic.json
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: node tools/traffic/snapshot.js
      - name: Commit the snapshot
        run: |
          git config user.name "traffic-snapshot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/traffic.json
          git diff --cached --quiet || git commit -m "Traffic snapshot $(date -u +%F)"
          git push
